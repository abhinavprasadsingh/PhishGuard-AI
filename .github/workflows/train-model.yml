name: Train phishing URL model
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_uci_dataset.py'
      - 'src/train.py'
      - 'src/features.py'
      - '.github/workflows/train-model.yml'
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ucimlrepo
      - name: Prepare dataset
        run: python scripts/prepare_uci_dataset.py
      - name: Train and evaluate
        run: |
          mkdir -p models reports/run
          python -m src.train --input data/urls.csv --output models/phishing_model.joblib 2>&1 | tee reports/run/training-output.txt
          python - <<'PY'
          import json
          import pandas as pd
          df = pd.read_csv('data/urls.csv')
          report = {'dataset': 'UCI PhiUSIIL dataset 967', 'source': 'https://archive.ics.uci.edu/dataset/967/phiusiil+phishing+url+dataset', 'rows': int(len(df)), 'label_counts': {str(k): int(v) for k, v in df['label'].value_counts().sort_index().items()}, 'labels': {'0': 'legitimate', '1': 'phishing'}}
          with open('reports/run/evaluation.json', 'w', encoding='utf-8') as f: json.dump(report, f, indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phishshield-trained-model-and-evaluation
          path: |
            models/phishing_model.joblib
            reports/run/
          retention-days: 30