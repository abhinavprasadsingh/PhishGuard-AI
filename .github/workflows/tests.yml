name: Python checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  tests:
    # Pin the runner image to avoid surprise changes from ubuntu-latest migrations.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py src tests
      - run: pytest -q
