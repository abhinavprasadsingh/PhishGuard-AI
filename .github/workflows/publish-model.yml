name: Build and publish phishing model

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "src/**"
      - "scripts/prepare_uci_dataset.py"
      - "requirements.txt"
      - ".github/workflows/publish-model.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-phishing-model-recovery
  cancel-in-progress: true

jobs:
  train-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Recover existing trained model when available
        id: recover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if test -s models/phishing_model.joblib; then
            echo "A model is already committed; no recovery needed."
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Recover the validated model from the successful training run that
          # predates this publishing workflow. This avoids blocking deployment
          # on a fresh download of the large UCI dataset.
          if gh run download 38618944295 --repo "$GITHUB_REPOSITORY" --name phishshield-trained-model-and-evaluation --dir .model-artifact; then
            if test -s .model-artifact/models/phishing_model.joblib; then
              mkdir -p models
              cp .model-artifact/models/phishing_model.joblib models/phishing_model.joblib
              echo "Recovered the previously trained model artifact."
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.recover.outputs.available != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.recover.outputs.available != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ucimlrepo

      - name: Prepare labeled URL dataset
        if: steps.recover.outputs.available != 'true'
        run: timeout 8m python scripts/prepare_uci_dataset.py

      - name: Train and evaluate model
        if: steps.recover.outputs.available != 'true'
        run: python -m src.train --input data/urls.csv --output models/phishing_model.joblib

      - name: Verify model file
        run: test -s models/phishing_model.joblib

      - name: Publish model artifact to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/phishing_model.joblib
          if git diff --cached --quiet; then
            echo "The committed model is already up to date."
          else
            git commit -m "chore: publish trained phishing model"
            git push origin HEAD:main
          fi
