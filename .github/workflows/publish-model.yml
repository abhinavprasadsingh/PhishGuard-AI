name: Build and publish phishing model

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "src/**"
      - "scripts/prepare_uci_dataset.py"
      - "requirements.txt"
      - ".github/workflows/publish-model.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-phishing-model
  cancel-in-progress: false

jobs:
  train-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ucimlrepo

      - name: Prepare labeled URL dataset
        run: python scripts/prepare_uci_dataset.py

      - name: Train and evaluate model
        run: python -m src.train --input data/urls.csv --output models/phishing_model.joblib

      - name: Publish model artifact to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/phishing_model.joblib
          if git diff --cached --quiet; then
            echo "The committed model is already up to date."
          else
            git commit -m "chore: publish trained phishing model"
            git push origin HEAD:main
          fi
